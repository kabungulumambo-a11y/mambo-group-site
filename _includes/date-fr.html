{%- assign mois = "janvier,février,mars,avril,mai,juin,juillet,août,septembre,octobre,novembre,décembre" | split: "," -%}
{%- assign m = include.date | date: "%-m" | minus: 1 -%}
<time datetime="{{ include.date | date: '%Y-%m-%d' }}">{{ include.date | date: "%-d" }} {{ mois[m] }} {{ include.date | date: "%Y" }}</time>
